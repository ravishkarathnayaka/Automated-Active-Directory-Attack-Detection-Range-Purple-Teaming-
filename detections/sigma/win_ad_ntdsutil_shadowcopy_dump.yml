title: Active Directory NTDS.dit Credential Extraction via NTDSUtil or VSSAdmin
id: d83e91a0-4321-4f91-8932-a5e81d720b41
status: test
description: Detects invocation of ntdsutil.exe or vssadmin.exe attempting to snapshot or extract the Active Directory NTDS.dit database for offline password cracking.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://adsecurity.org/?p=2398
author: Purple Team Detection Engineering
date: 2026/10/26
modified: 2026/10/26
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ntdsutil:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains:
      - 'ifm'
      - 'create full'
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'create shadow'
  condition: selection_ntdsutil or selection_vssadmin
falsepositives:
  - Legitimate domain controller backup procedures using NTDSUtil IFM
  - Enterprise backup software creating system state shadow copies
level: high
