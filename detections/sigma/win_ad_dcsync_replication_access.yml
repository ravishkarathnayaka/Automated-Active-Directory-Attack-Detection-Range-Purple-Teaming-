title: Active Directory DCSync Replication Access by Non-DC Account
id: 61e14930-b3b0-4dbb-8ea3-3e0f7ff8b0c9
status: test
description: Detects directory replication access requests (Event ID 4662) referencing DRSUAPI replication GUIDs from non-machine accounts, indicative of DCSync attacks.
references:
  - https://attack.mitre.org/techniques/T1003/006/
  - https://adsecurity.org/?p=1729
author: Purple Team Detection Engineering
date: 2026/09/11
modified: 2026/09/11
tags:
  - attack.credential_access
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    AccessMask: '0x100'
  drsuapi_guids:
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e4b325-9be7-11d1-b8c0-00c04fc2dcd2'
  filter_machine_accounts:
    SubjectUserName|endswith: '$'
  condition: selection and drsuapi_guids and not filter_machine_accounts
falsepositives:
  - Legitimate replication tools running under service accounts (e.g., Azure AD Connect)
  - Active Directory migration or backup utilities
level: critical
