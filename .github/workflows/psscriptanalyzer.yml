name: PSScriptAnalyzer Quality Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  psscriptanalyzer:
    name: PowerShell Static Code Analysis
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning
          if ($results) {
              $results | Format-Table ScriptName, Line, Message, Severity -AutoSize
              # Only fail on Severity Error, allow Informational/Warning for lab emulation scripts
              $errors = $results | Where-Object { $_.Severity -eq 'Error' }
              if ($errors) {
                  Write-Error "Found $($errors.Count) critical PSScriptAnalyzer error(s)."
                  exit 1
              }
          }
          Write-Host "[+] PSScriptAnalyzer completed with 0 critical errors." -ForegroundColor Green
